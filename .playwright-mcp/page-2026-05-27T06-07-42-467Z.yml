      - generic [ref=e44]:
        - paragraph [ref=e45]: "Python Basics is where you learn how Python actually behaves while code is running. You will start small: evaluate expressions, store values in variables, work with strings and lists, make decisions with if/elif/else, repeat work with loops, and package logic inside functions. This topic is not about memorizing syntax lines. It is about building a mental picture of execution so you can read code, debug confidently, and write clean small programs that do what you expect."
        - generic [ref=e46]:
          - heading "Mental Model" [level=3] [ref=e47]
          - paragraph [ref=e48]: Think of a Python file as a sequence of steps. Python runs from top to bottom, one statement at a time. Expressions create values. Assignment gives those values names. Indentation marks which lines belong to the same block. Conditions choose one path. Loops repeat a block across items. Functions let you bundle steps into reusable units and return results.
        - generic [ref=e49]:
          - heading "Learning Outcome" [level=3] [ref=e50]
          - paragraph [ref=e51]: By the end of this topic, you should be able to read a short Python script and explain what each line does, what each variable currently holds, and why a branch or loop behaves the way it does. You should also be able to write and test small functions, and fix common beginner issues like NameError, IndexError, and indentation mistakes.