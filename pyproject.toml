[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  ".pytest_cache",
  "scripts/node_modules",
  "static/vendor",
]

[tool.ruff.lint]
# Keep the first OSS lint gate focused on correctness, not style churn.
select = ["E9", "F63", "F7", "F82"]
